<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Expense Tracker</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:linear-gradient(to right,#dbeafe,#f8fafc);
      min-height:100vh;
      padding:20px;
      color:#0f172a;
    }

  
   <button
onclick="signupUser()"
style="
width:100%;
margin-top:10px;
background:#16a34a;
">

  Sign Up

</button>
  </div>

</div>

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      text-align:center;
      margin-bottom:30px;
    }

    .header h1{
      font-size:40px;
      color:#0f172a;
      margin-bottom:10px;
    }

    .header p{
      color:#475569;
      font-size:16px;
    }

    .top-section{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card h3{
      margin-bottom:10px;
      color:#334155;
      font-size:18px;
    }

    .amount{
      font-size:32px;
      font-weight:bold;
    }

    .income{
      color:#16a34a;
    }

    .expense{
      color:#dc2626;
    }

    .balance{
      color:#0f172a;
    }

    .main-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
    }

    .form-section,
    .history-section,
    .chart-section{
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }

    .form-section h2,
    .history-section h2,
    .chart-section h2{
      margin-bottom:20px;
      color:#0f172a;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    input,
    select{
      padding:12px;
      border-radius:10px;
      border:1px solid #cbd5e1;
      font-size:15px;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:#0f172a;
    }

    button{
      padding:12px;
      border:none;
      border-radius:10px;
      background:#0f172a;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1e293b;
    }

    .history-list{
      margin-top:10px;
      max-height:400px;
      overflow-y:auto;
    }

    .transaction{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:#f8fafc;
      border-radius:12px;
      margin-bottom:12px;
    }

    .transaction-info h4{
      font-size:16px;
      margin-bottom:5px;
    }

    .transaction-info p{
      color:#64748b;
      font-size:14px;
    }

    .transaction-right{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .transaction-amount{
      font-weight:bold;
    }

    .plus{
      color:#16a34a;
    }

    .minus{
      color:#dc2626;
    }

    .delete-btn{
      background:#ef4444;
      padding:7px 10px;
      border-radius:8px;
      font-size:13px;
    }

    .delete-btn:hover{
      background:#dc2626;
    }

    .chart-container{
  margin-top:20px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#expenseChart{
  max-width:600px;
  max-height:600px;
}
    @media(max-width:900px){
      .main-grid{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:500px){

      .header h1{
        font-size:28px;
      }

      .amount{
        font-size:24px;
      }

      .transaction{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
      }
    }

  </style>
</head>

<body>
<!-- Login Page -->

<div id="loginPage" style="
position:fixed;
inset:0;
background:linear-gradient(to right,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
">

  <div style="
  background:white;
  padding:40px;
  border-radius:20px;
  width:350px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  text-align:center;
  ">

    <h1 style="color:#0f172a; margin-bottom:10px;">
      Welcome Back 👋
    </h1>

    <p style="color:#64748b; margin-bottom:25px;">
      Login to Smart Expense Tracker
    </p>

    <input
      type="email"
      id="email"
      placeholder="Enter Email"
      style="width:100%; margin-bottom:15px;"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
      style="width:100%; margin-bottom:20px;"
    >

    <button onclick="loginUser()" style="width:100%;">
      Login
    </button>

<button
onclick="signupUser()"
style="
width:100%;
margin-top:10px;
background:#16a34a;
">

Sign Up

</button>

  </div>

</div>

<div class="container">

  <!-- Header -->

  <div class="header">
    <h1>💰 Smart Expense Tracker</h1>
    <p>Track your income and expenses easily</p>
  </div>

  <!-- Summary Cards -->

  <div class="top-section">

    <div class="card">
      <h3>Total Balance</h3>
      <div class="amount balance" id="balance">₹0</div>
    </div>

    <div class="card">
      <h3>Total Income</h3>
      <div class="amount income" id="income">₹0</div>
    </div>

    <div class="card">
      <h3>Total Expenses</h3>
      <div class="amount expense" id="expense">₹0</div>
    </div>

  </div>

  <!-- Main Grid -->

  <div class="main-grid">

    <!-- Form -->

    <div class="form-section">

      <h2>Add Transaction</h2>

      <form id="expense-form">

        <input
          type="text"
          id="title"
          placeholder="Enter title"
          required
        >

        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          required
        >

        <select id="type" required>
          <option value="">Select Type</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <select id="category" required>
          <option value="">Select Category</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Salary</option>
          <option>Other</option>
        </select>

        <button type="submit">Add Transaction</button>

      </form>

    </div>

    <!-- History -->

    <div class="history-section">

      <h2>Transaction History</h2>

      <div class="history-list" id="history-list"></div>

    </div>

  </div>

  <!-- Chart -->

  <div class="chart-section" style="margin-top:25px;">

    <h2>Expense Analytics</h2>

    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyD3pBFcOQT1OzjKMyOabD_1R8dPGGnhlqA",

  authDomain: "smart-expense-tracker-a56cf.firebaseapp.com",

  projectId: "smart-expense-tracker-a56cf",

  storageBucket: "smart-expense-tracker-a56cf.firebasestorage.app",

  messagingSenderId: "485605941797",

  appId: "1:485605941797:web:5a79bcb7b8c6b3f9b095cc",

  measurementId: "G-F63TPFHVMC"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

  const form = document.getElementById('expense-form');

  const titleInput = document.getElementById('title');
  const amountInput = document.getElementById('amount');
  const typeInput = document.getElementById('type');
  const categoryInput = document.getElementById('category');

  const historyList = document.getElementById('history-list');

  const balanceEl = document.getElementById('balance');
  const incomeEl = document.getElementById('income');
  const expenseEl = document.getElementById('expense');

  let transactions = [];

let currentUserEmail = "";

  // Chart

  const ctx = document.getElementById('expenseChart').getContext('2d');

  const expenseChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: [],
      datasets: [{
        data: [],
        backgroundColor: [
          '#0f172a',
          '#1e293b',
          '#334155',
          '#475569',
          '#64748b',
          '#0ea5e9',
          '#16a34a',
          '#f59e0b'
        ]
      }]
    },

    options: {
      responsive: true,
cutout: '70%',
      plugins: {
        legend: {
          position: 'bottom'
        }
      }
    }
  });

  // Save Data

 async function saveTransaction(transaction){

  await addDoc(collection(db, currentUserEmail), transaction);

} 

async function loadTransactions(){

  transactions = [];

  const querySnapshot = await getDocs(collection(db, currentUserEmail));

  querySnapshot.forEach((docItem) => {

    transactions.push({

      firestoreId: docItem.id,

      ...docItem.data()

    });

  });

  updateSummary();

  displayTransactions();

  updateChart();

}

  // Update Summary

  function updateSummary(){

    let income = 0;
    let expense = 0;

    transactions.forEach(transaction => {

      if(transaction.type === 'income'){
        income += transaction.amount;
      }
      else{
        expense += transaction.amount;
      }

    });

    const balance = income - expense;

    balanceEl.textContent = `₹${balance}`;
    incomeEl.textContent = `₹${income}`;
    expenseEl.textContent = `₹${expense}`;
  }

  // Update Chart

  function updateChart(){

    const expenseData = {};

    transactions.forEach(transaction => {

      if(transaction.type === 'expense'){

        if(expenseData[transaction.category]){
          expenseData[transaction.category] += transaction.amount;
        }
        else{
          expenseData[transaction.category] = transaction.amount;
        }

      }

    });

    expenseChart.data.labels = Object.keys(expenseData);

    expenseChart.data.datasets[0].data = Object.values(expenseData);

    expenseChart.update();
  }

  // Display Transactions

  function displayTransactions(){

    historyList.innerHTML = '';

    transactions.forEach(transaction => {

      const div = document.createElement('div');

      div.classList.add('transaction');

      div.innerHTML = `

        <div class="transaction-info">

          <h4>${transaction.title}</h4>

          <p>${transaction.category}</p>

        </div>

        <div class="transaction-right">

          <span class="transaction-amount ${transaction.type === 'income' ? 'plus' : 'minus'}">

            ${transaction.type === 'income' ? '+' : '-'} ₹${transaction.amount}

          </span>

          <button class="delete-btn" onclick="deleteTransaction(${transaction.id}, '${transaction.firestoreId}')">

            Delete

          </button>

        </div>

      `;

      historyList.appendChild(div);

    });

  }

  // Delete Transaction

  async function deleteTransaction(id, firestoreId){

  await deleteDoc(doc(db, currentUserEmail, firestoreId));

  transactions = transactions.filter(
    transaction => transaction.id !== id
  );

  updateSummary();

  displayTransactions();

  updateChart();

}
  // Form Submit

  form.addEventListener('submit', function(e){

    e.preventDefault();

    const transaction = {

      id: Date.now(),
      title: titleInput.value,
      amount: Number(amountInput.value),
      type: typeInput.value,
      category: categoryInput.value

    };

    transactions.push(transaction);

    saveTransaction(transaction);

    updateSummary();

    displayTransactions();

    updateChart();

    form.reset();

  });

 window.loginUser = function(){

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)

  .then(() => {

    alert("Login Successful ✅");

    document.getElementById("loginPage").style.display = "none";

  })

  .catch((error) => {

    alert(error.message);

  });

}
window.signupUser = function(){

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)

 .then((userCredential) => {

  currentUserEmail = userCredential.user.email;

  alert("Login Successful ✅");

  document.getElementById("loginPage").style.display = "none";

  loadTransactions();

})
  .catch((error) => {

    alert(error.message);

  });

}
 // Initial Load

 </script>

</body>
</html>
